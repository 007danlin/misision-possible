[project]
name = "agent"
version = "0.2.0"
description = "misison-possible gRPC agent (demonstration implementation)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"grpcio==1.80.0",
	"protobuf==6.33.6",
	"pydantic==2.12.3",
	"httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["travel_agent*", "proto*"]

[tool.setuptools.package-data]
travel_agent = ["catalogue.json", "journey_catalogue.json", "cities.json"]
